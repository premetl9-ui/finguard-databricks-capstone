project:
  catalog: bootcamp_students
  derive_username_from_session: true
  bronze_schema_suffix: _bronze
  silver_schema_suffix: _silver
  gold_schema_suffix: _gold
  operations_schema_suffix: _operations
  cdc_schema_suffix: _lakebase_cdc

transactions:
  source_format: csv
  raw_volume_name: raw
  paysim_subdirectory: paysim
  checkpoint_volume_name: checkpoints
  checkpoint_name: transaction_risk_v1
  default_currency: USD
  home_currency: USD
  high_value_threshold: 10000

fx:
  provider: alpha_vantage
  secret_scope: finguard
  secret_key: alpha-vantage-api-key
  current_refresh_hours: 6
  daily_refresh_hour_utc: 1
  currency_pairs:
    - [USD, EUR]
    - [USD, GBP]
    - [USD, JPY]
  timeout_seconds: 15
  max_retries: 3

streaming:
  trigger_seconds: 10
  watermark_minutes: 30
  risk_window_minutes: 10
  p95_latency_target_seconds: 60

risk:
  alert_threshold: 50
  high_threshold: 60
  critical_threshold: 80

lakebase:
  project: FinGuard-Lakebase
  branch: production
  database: databricks_postgres
  derive_schema_from_user: true
  app_resource_key: postgres
  # Supply host and full endpoint resource name at runtime.
  # Never place an OAuth token or password in this file.

model:
  app_resource_key: llm
  endpoint: databricks-meta-llama-3-3-70b-instruct
